owner: RevealUIStudio
repo: status

# Template sync retired 2026-07-25 (GAP-420). .github/workflows/update-template.yml
# was deleted: the default GITHUB_TOKEN can never write .github/workflows/* files
# (a GitHub platform restriction, not a settable permission), so the daily sync job
# had failed every run since at least 2026-07-05. Fixing it forward would need a PAT
# with Workflows: write, which would hand a daily unattended cron running
# upptime/uptime-monitor@master (a floating third-party ref) the power to rewrite
# every workflow file in this repo and push straight to master with no review — not
# a durable security posture for a repo whose monitoring is otherwise healthy.
# Upptime template upgrades (new workflow versions, config schema changes) are now a
# deliberate manual event: diff this repo's .github/workflows/ against a fresh
# `npx @upptime/config-check` or the current release at
# https://github.com/upptime/upptime/releases when you want to pull in a template
# update, and re-apply by hand.

sites:
  # Marketing site (revealui.com — update URL once deployed)
  - name: Website
    url: https://revealui.com
    expectedStatusCodes:
      - 200
      - 301
      - 302

  # API health endpoint
  - name: API
    url: https://api.revealui.com/health
    expectedStatusCodes:
      - 200

  # Admin dashboard
  - name: Admin
    url: https://admin.revealui.com
    expectedStatusCodes:
      - 200
      - 301
      - 302

  # License service liveness (critical for Track C perpetual customers).
  # Probes the GET-able /features route: the verify/generate endpoints are
  # POST-with-body, so a HEAD/GET uptime check can only ever 404 on them.
  - name: License Service
    url: https://api.revealui.com/api/license/features
    method: HEAD
    expectedStatusCodes:
      - 200
      - 401
      - 405

status-website:
  # Use GitHub Pages URL until custom domain is configured
  # To use status.revealui.com: uncomment cname, add CNAME DNS record pointing to RevealUIStudio.github.io
  # cname: status.revealui.com
  baseUrl: /status
  logoUrl: https://raw.githubusercontent.com/RevealUIStudio/revealui/test/apps/marketing/public/favicon.svg
  name: RevealUI Status
  introTitle: "**RevealUI** system status and uptime history."
  introMessage: "Real-time monitoring powered by [Upptime](https://github.com/upptime/upptime). Incidents are tracked as [GitHub Issues](https://github.com/RevealUIStudio/status/issues)."
  navbar:
    - title: Status
      href: /
    - title: RevealUI
      href: https://revealui.com
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
  theme: light

# Check every 5 minutes (default). Public repo = unlimited GitHub Actions minutes.
workflowSchedule:
  uptime: "*/5 * * * *"
  graphs: "0 0 * * *"
  staticSite: "0 1 * * *"

# Open GitHub Issues on outages, assign to founder
assignees:
  - joshua-v-dev

# Notifications: email via GitHub issue notifications (free).
# Add Slack/Discord webhook later if needed.
